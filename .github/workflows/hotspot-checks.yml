name: Hotspot integrity checks
on:
  pull_request:
  push:
    branches: [main, 'improve/**']
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install beautifulsoup4 tinycss2
      - name: Validate JavaScript syntax
        run: node --check js/portal.core.js
      - name: Validate RouterOS mappings and source rules
        run: python -m unittest discover -s tests -v